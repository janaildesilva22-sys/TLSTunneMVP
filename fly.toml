app = "tlstunnelmvp-janailde"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 4433
  protocol = "tcp"

  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls"]

    [services.ports.tls_options]
      versions = ["TLSv1.2", "TLSv1.3"]
